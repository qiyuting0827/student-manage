[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 同步中转函数（与「单词默写」同款做法，比 redirect 更稳）
[functions]
  directory = "netlify/functions"

# 备用同域中转：浏览器只访问本站 /supa/*，由 Netlify 服务器转发到 Supabase
# 目的：国内网络直连 supabase.co 常被重置，走 Netlify 可绕开
[[redirects]]
  from = "/supa/*"
  to = "https://ruscbaukapxxlzwburre.supabase.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
